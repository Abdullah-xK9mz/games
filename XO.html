<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1B4B" />
    <title>إكس أو</title>
    <!-- التنسيق العام للصفحة -->
    <style>
      /* ===== الهوية الموحدة: ليل نيلي + بنفسجي + ذهبي ===== */
      :root {
        --bg: #1e1b4b;
        --bg2: #2a2670;
        --brand: #7c3aed;
        --brand-d: #4338ca;
        --accent: #fbbf24;
        --card: #f5f3ff;
        --ink: #1e1b4b;
        --ink-soft: #4c1d95;
        --line: #ddd6fe;
        --font: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: #eef2ff;
        user-select: none;
        -webkit-user-select: none;
        padding-bottom: env(safe-area-inset-bottom);
      }
      header {
        background: linear-gradient(135deg, var(--brand-d), var(--brand));
        color: #fff;
        padding: calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 16px
          calc(18px + env(safe-area-inset-left));
      }
      h1 {
        margin: 0;
        font-size: 23px;
      }
      .seg {
        display: flex;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 4px;
        gap: 4px;
        margin-top: 12px;
      }
      .seg button {
        flex: 1;
        border: 0;
        border-radius: 9px;
        padding: 9px 4px;
        background: transparent;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
      }
      .seg button.on {
        background: var(--accent);
        color: var(--ink);
      }
      main {
        padding: 14px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));
        max-width: 460px;
        margin: 0 auto;
      }
      /* لوحة النتائج */
      .scores {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .sc {
        background: var(--card);
        border-radius: 14px;
        padding: 10px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        border: 2px solid transparent;
        transition: border-color 0.2s;
      }
      .sc.turn {
        border-color: var(--accent);
      }
      .sc b {
        display: block;
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }
      .sc small {
        font-size: 12px;
        color: var(--ink-soft);
        font-weight: 600;
      }
      .sc.x b {
        color: #7c3aed;
      }
      .sc.o b {
        color: #d97706;
      }
      .sc.d b {
        color: #64748b;
      }
      #status {
        text-align: center;
        font-weight: 700;
        font-size: 17px;
        margin: 14px 0 10px;
        min-height: 24px;
      }
      .boardwrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        max-width: 400px;
        margin: 0 auto;
      }
      /* اللوحة والخانات */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
        height: 100%;
        background: var(--bg2);
        border-radius: 20px;
        padding: 8px;
      }
      .cell {
        border: 0;
        background: var(--card);
        border-radius: 14px;
        display: grid;
        place-items: center;
        padding: 0;
        position: relative;
      }
      .cell:active:not(:disabled) {
        background: #ede9fe;
      }
      .cell svg {
        width: 64%;
        height: 64%;
        overflow: visible;
      }
      .cell.win {
        background: #fef9c3;
      }
      /* رسوم X وO المتحركة */
      .mx line,
      .mo circle {
        fill: none;
        stroke-width: 13;
        stroke-linecap: round;
      }
      .mx line {
        stroke: #7c3aed;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 0.22s ease-out forwards;
      }
      .mx line + line {
        animation-delay: 0.12s;
      }
      .mo circle {
        stroke: #f59e0b;
        stroke-dasharray: 252;
        stroke-dashoffset: 252;
        animation: draw 0.3s ease-out forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* خط الفوز */
      .winline {
        position: absolute;
        inset: 0;
        pointer-events: none;
        width: 100%;
        height: 100%;
      }
      .winline line {
        stroke: var(--bg);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 140;
        stroke-dashoffset: 140;
        opacity: 0.75;
      }
      .winline.show line {
        animation: draw 0.45s 0.1s ease-out forwards;
      }
      /* الأزرار والإعدادات */
      .ctrl {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .btn {
        flex: 1;
        border: 0;
        border-radius: 14px;
        background: var(--card);
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 15px;
        padding: 13px 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--ink);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .opts {
        margin-top: 14px;
        background: var(--card);
        border-radius: 16px;
        padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
      }
      .opt span {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-soft);
      }
      .mini {
        display: flex;
        background: var(--line);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;
      }
      .mini button {
        border: 0;
        border-radius: 8px;
        padding: 8px 11px;
        background: transparent;
        color: var(--ink-soft);
        font-weight: 700;
        font-size: 13px;
      }
      .mini button.on {
        background: var(--accent);
        color: var(--ink);
      }
      .reset {
        border: 0;
        background: none;
        color: #c7d2fe;
        font-size: 13px;
        text-decoration: underline;
        padding: 8px 0 0;
        display: block;
        margin: 0 auto;
      }
      [hidden] {
        display: none !important;
      }

      /* عرض النص العربي بالاتجاه الصحيح دون تغيير التخطيط */
      h1,
      h2,
      p,
      b,
      small,
      span,
      button,
      div {
        unicode-bidi: plaintext;
      }
    </style>
  </head>
  <body>
    <!-- الرأس: العنوان واختيار وضع اللعب -->
    <header>
      <h1>❌⭕ إكس أو</h1>
      <div class="seg" id="mode">
        <button data-m="ai" class="on">ضد الذكاء الاصطناعي</button><button data-m="pvp">لاعبان</button>
      </div>
    </header>
    <!-- المحتوى الرئيسي: النتائج واللوحة والأزرار والإعدادات -->
    <main>
      <!-- لوحة النتائج -->
      <div class="scores">
        <div class="sc x" id="scX"><b id="sx">0</b><small id="lx">أنت (X)</small></div>
        <div class="sc d"><b id="sd">0</b><small>تعادل</small></div>
        <div class="sc o" id="scO"><b id="so">0</b><small id="lo">الذكاء الاصطناعي (O)</small></div>
      </div>
      <div id="status"></div>
      <!-- لوحة اللعب وخط الفوز -->
      <div class="boardwrap">
        <div class="board" id="board"></div>
        <svg class="winline" id="winline" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line id="wl" x1="0" y1="0" x2="0" y2="0" />
        </svg>
      </div>
      <!-- أزرار التراجع واللعبة الجديدة -->
      <div class="ctrl">
        <button class="btn" id="undo">↶ تراجع</button><button class="btn primary" id="new">لعبة جديدة</button>
      </div>
      <!-- الإعدادات: الصعوبة ومن يبدأ -->
      <div class="opts">
        <div class="opt" id="diffRow">
          <span>الصعوبة</span>
          <div class="mini" id="diff">
            <button data-d="easy">سهل</button><button data-d="medium">متوسط</button
            ><button data-d="hard">لا يُهزم</button>
          </div>
        </div>
        <div class="opt">
          <span>من يبدأ</span>
          <div class="mini" id="starts">
            <button data-s="X">X</button><button data-s="O">O</button><button data-s="alt">بالتناوب</button>
          </div>
        </div>
      </div>
      <button class="reset" id="resetScores">إعادة ضبط النتائج</button>
    </main>
    <!-- منطق اللعبة -->
    <script>
      /* المتغيرات والإعدادات الأساسية */
      const $ = (s) => document.querySelector(s);
      const LINES = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];
      const HUMAN = 'X',
        AI = 'O';
      let cfg = { mode: 'ai', diff: 'medium', starts: 'X' };
      let scores = { ai: { X: 0, O: 0, D: 0 }, pvp: { X: 0, O: 0, D: 0 } };
      let board,
        turn,
        history,
        over,
        aiTimer = 0,
        gameNo = 0,
        firstOfGame = 'X';
      try {
        Object.assign(cfg, JSON.parse(localStorage.getItem('ttt_cfg') || '{}'));
      } catch (e) {}
      try {
        const s = JSON.parse(localStorage.getItem('ttt_scores') || 'null');
        if (s && s.ai && s.pvp) scores = s;
      } catch (e) {}
      /* حفظ الإعدادات والنتائج في المتصفح */
      function saveCfg() {
        try {
          localStorage.setItem('ttt_cfg', JSON.stringify(cfg));
        } catch (e) {}
      }
      function saveScores() {
        try {
          localStorage.setItem('ttt_scores', JSON.stringify(scores));
        } catch (e) {}
      }
      function buzz(p) {
        if (window.FreeApp && FreeApp.vibrate) {
          try {
            FreeApp.vibrate(p);
            return;
          } catch (e) {}
        }
        if (navigator.vibrate) navigator.vibrate(p);
      }

      /* بناء خانات اللوحة */
      const cells = [];
      for (let i = 0; i < 9; i++) {
        const b = document.createElement('button');
        b.className = 'cell';
        b.setAttribute('aria-label', 'الخانة ' + (i + 1));
        b.onclick = () => humanMove(i);
        $('#board').appendChild(b);
        cells.push(b);
      }

      /* فحص الفائز */
      function winner(b) {
        for (const l of LINES)
          if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l };
        return b.every(Boolean) ? { p: 'D' } : null;
      }
      /* خوارزمية الذكاء الاصطناعي (Minimax) لاختيار أقوى حركة */
      function minimax(b, player, depth) {
        const w = winner(b);
        if (w) return { score: w.p === AI ? 10 - depth : w.p === HUMAN ? depth - 10 : 0 };
        let best = { score: player === AI ? -Infinity : Infinity, idx: -1 };
        for (let i = 0; i < 9; i++)
          if (!b[i]) {
            b[i] = player;
            const r = minimax(b, player === AI ? HUMAN : AI, depth + 1);
            b[i] = null;
            if (player === AI ? r.score > best.score : r.score < best.score)
              best = { score: r.score, idx: i };
          }
        return best;
      }
      function findWinning(b, p) {
        for (const l of LINES) {
          const v = l.map((i) => b[i]);
          if (v.filter((x) => x === p).length === 2 && v.includes(null)) return l[v.indexOf(null)];
        }
        return -1;
      }
      /* اختيار حركة الذكاء الاصطناعي حسب مستوى الصعوبة */
      function aiPick() {
        const empty = board.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
        const rand = () => empty[Math.floor(Math.random() * empty.length)];
        if (cfg.diff === 'easy') return rand();
        if (cfg.diff === 'medium') {
          const w = findWinning(board, AI);
          if (w >= 0) return w;
          const bl = findWinning(board, HUMAN);
          if (bl >= 0 && Math.random() < 0.85) return bl;
          if (!board[4] && Math.random() < 0.6) return 4;
          return rand();
        }
        if (empty.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
        return minimax(board.slice(), AI, 0).idx;
      }

      /* بدء لعبة جديدة */
      function newGame() {
        clearTimeout(aiTimer);
        gameNo++;
        firstOfGame = cfg.starts === 'alt' ? (gameNo % 2 ? 'X' : 'O') : cfg.starts;
        board = Array(9).fill(null);
        turn = firstOfGame;
        history = [];
        over = null;
        $('#winline').classList.remove('show');
        cells.forEach((c) => {
          c.textContent = '';
          c.classList.remove('win');
        });
        render();
        maybeAi();
      }
      /* رسم علامة X أو O */
      function mark(p) {
        const ns = 'http://www.w3.org/2000/svg',
          svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        if (p === 'X') {
          svg.setAttribute('class', 'mx');
          [
            [15, 15, 85, 85],
            [85, 15, 15, 85],
          ].forEach((c) => {
            const l = document.createElementNS(ns, 'line');
            l.setAttribute('x1', c[0]);
            l.setAttribute('y1', c[1]);
            l.setAttribute('x2', c[2]);
            l.setAttribute('y2', c[3]);
            l.setAttribute('pathLength', '100');
            svg.appendChild(l);
          });
        } else {
          svg.setAttribute('class', 'mo');
          const c = document.createElementNS(ns, 'circle');
          c.setAttribute('cx', 50);
          c.setAttribute('cy', 50);
          c.setAttribute('r', 38);
          c.setAttribute('pathLength', '252');
          svg.appendChild(c);
        }
        return svg;
      }
      /* وضع العلامة على الخانة */
      function place(i) {
        if (over || board[i]) return false;
        board[i] = turn;
        history.push(i);
        cells[i].textContent = '';
        cells[i].appendChild(mark(turn));
        buzz(10);
        const w = winner(board);
        if (w) finish(w);
        else turn = turn === 'X' ? 'O' : 'X';
        render();
        return true;
      }
      function humanMove(i) {
        if (over || (cfg.mode === 'ai' && turn === AI)) return;
        if (place(i)) maybeAi();
      }
      function maybeAi() {
        if (cfg.mode !== 'ai' || over || turn !== AI || document.hidden) return;
        clearTimeout(aiTimer);
        aiTimer = setTimeout(() => {
          if (!over && turn === AI) place(aiPick());
        }, 420);
      }
      /* إنهاء اللعبة ورسم خط الفوز */
      function finish(w) {
        over = w;
        const s = scores[cfg.mode];
        s[w.p]++;
        saveScores();
        if (w.line) {
          w.line.forEach((i) => cells[i].classList.add('win'));
          const pos = (i) => ({ x: (i % 3) * 33.333 + 16.667, y: Math.floor(i / 3) * 33.333 + 16.667 });
          const a = pos(w.line[0]),
            b = pos(w.line[2]);
          const dx = b.x - a.x,
            dy = b.y - a.y,
            len = Math.hypot(dx, dy) || 1,
            ext = 9;
          const l = $('#wl');
          l.setAttribute('x1', a.x - (dx / len) * ext);
          l.setAttribute('y1', a.y - (dy / len) * ext);
          l.setAttribute('x2', b.x + (dx / len) * ext);
          l.setAttribute('y2', b.y + (dy / len) * ext);
          const wl = $('#winline');
          wl.classList.remove('show');
          void wl.getBoundingClientRect();
          wl.classList.add('show');
          if (cfg.mode === 'pvp' || w.p === HUMAN) buzz([80, 60, 80, 60, 200]);
          else buzz(200);
        } else buzz(60);
      }
      /* التراجع عن الحركة */
      function undo() {
        if (!history.length) return;
        clearTimeout(aiTimer);
        if (over) {
          const s = scores[cfg.mode];
          s[over.p] = Math.max(0, s[over.p] - 1);
          saveScores();
          over = null;
          $('#winline').classList.remove('show');
          cells.forEach((c) => c.classList.remove('win'));
        }
        // في وضع الذكاء الاصطناعي: نرجع إلى دور اللاعب (ونحذف رد الذكاء الاصطناعي أيضًا)
        let steps = 1;
        if (cfg.mode === 'ai') {
          const lastBy = board[history[history.length - 1]];
          steps = lastBy === AI && history.length >= 2 ? 2 : 1;
          if (lastBy === HUMAN) steps = 1;
        }
        for (let k = 0; k < steps && history.length; k++) {
          const i = history.pop();
          turn = board[i];
          board[i] = null;
          cells[i].textContent = '';
        }
        render();
        maybeAi();
      }
      /* تحديث الواجهة */
      function render() {
        const s = scores[cfg.mode];
        $('#sx').textContent = s.X;
        $('#so').textContent = s.O;
        $('#sd').textContent = s.D;
        $('#lx').textContent = cfg.mode === 'ai' ? 'أنت (X)' : 'اللاعب X';
        $('#lo').textContent = cfg.mode === 'ai' ? 'الذكاء الاصطناعي (O)' : 'اللاعب O';
        $('#scX').classList.toggle('turn', !over && turn === 'X');
        $('#scO').classList.toggle('turn', !over && turn === 'O');
        let msg;
        if (over)
          msg =
            over.p === 'D'
              ? 'تعادل 🤝'
              : cfg.mode === 'ai'
                ? over.p === HUMAN
                  ? 'فزت! 🎉'
                  : 'فاز الذكاء الاصطناعي 🤖'
                : 'فاز اللاعب ' + over.p + '! 🎉';
        else
          msg =
            cfg.mode === 'ai' ? (turn === HUMAN ? 'دورك' : 'الذكاء الاصطناعي يفكر…') : 'دور اللاعب ' + turn;
        $('#status').textContent = msg;
        cells.forEach((c, i) => (c.disabled = !!over || !!board[i] || (cfg.mode === 'ai' && turn === AI)));
        const humanMoves = history.filter((i) => board[i] === HUMAN).length;
        $('#undo').disabled =
          !history.length || (cfg.mode === 'ai' && (!humanMoves || (!over && turn === AI)));
        document
          .querySelectorAll('#mode button')
          .forEach((b) => b.classList.toggle('on', b.dataset.m === cfg.mode));
        document
          .querySelectorAll('#diff button')
          .forEach((b) => b.classList.toggle('on', b.dataset.d === cfg.diff));
        document
          .querySelectorAll('#starts button')
          .forEach((b) => b.classList.toggle('on', b.dataset.s === cfg.starts));
        $('#diffRow').hidden = cfg.mode !== 'ai';
      }
      /* ربط الأزرار بالأحداث */
      $('#mode').onclick = (e) => {
        const b = e.target.closest('button');
        if (!b || b.dataset.m === cfg.mode) return;
        cfg.mode = b.dataset.m;
        saveCfg();
        newGame();
      };
      $('#diff').onclick = (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        cfg.diff = b.dataset.d;
        saveCfg();
        newGame();
      };
      $('#starts').onclick = (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        cfg.starts = b.dataset.s;
        saveCfg();
        gameNo = 0;
        newGame();
      };
      $('#new').onclick = newGame;
      $('#undo').onclick = undo;
      $('#resetScores').onclick = () => {
        if (confirm('إعادة ضبط نتائج ' + (cfg.mode === 'ai' ? 'ضد الذكاء الاصطناعي' : 'لاعبان') + '؟')) {
          scores[cfg.mode] = { X: 0, O: 0, D: 0 };
          saveScores();
          render();
        }
      };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearTimeout(aiTimer);
        else maybeAi();
      });
      newGame();
    </script>
  </body>
</html>
