<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1E1B4B" />
    <title>الثعبان</title>
    <!-- التنسيق العام للصفحة -->
    <style>
      /* ===== الهوية الموحدة: ليل نيلي + بنفسجي + ذهبي ===== */
      :root {
        --bg: #1e1b4b;
        --bg2: #2a2670;
        --brand: #7c3aed;
        --brand-d: #4338ca;
        --accent: #fbbf24;
        --card: #f5f3ff;
        --ink: #1e1b4b;
        --ink-soft: #4c1d95;
        --line: #ddd6fe;
        --font: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        touch-action: none;
      }
      body {
        background: var(--bg);
        color: #fff;
        font-family: var(--font);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 480px;
        padding: 18px 20px;
        font-weight: 700;
        font-size: 18px;
      }
      canvas {
        background: var(--bg2);
        border-radius: 16px;
        box-shadow: inset 0 0 0 3px var(--brand-d);
        touch-action: none;
      }
      #msg {
        position: absolute;
        top: 45%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
      }
      .hint {
        opacity: 0.7;
        font-size: 14px;
        margin-top: 16px;
      }

      /* عرض النص العربي بالاتجاه الصحيح دون تغيير التخطيط */
      h1,
      h2,
      p,
      b,
      small,
      span,
      button,
      div {
        unicode-bidi: plaintext;
      }
    </style>
  </head>
  <body>
    <!-- الشريط العلوي: النتيجة وأفضل نتيجة -->
    <div class="bar">
      <span>🐍 <span id="s">0</span></span
      ><span>🏆 <span id="h">0</span></span>
    </div>
    <!-- لوحة اللعب -->
    <canvas id="c"></canvas>
    <div class="hint">اسحب للتوجيه · المس للبدء</div>
    <div id="msg">المس للبدء</div>
    <!-- منطق اللعبة -->
    <script>
      /* الإعدادات وحجم اللوحة */
      const N = 18,
        c = document.getElementById('c'),
        x = c.getContext('2d');
      const size = Math.min(innerWidth - 32, innerHeight - 200, 480),
        cell = Math.floor(size / N);
      c.width = c.height = cell * N;
      /* حالة اللعبة */
      let snake,
        dir,
        next,
        food,
        score,
        timer,
        running = false;
      let best = +(localStorage.getItem('snakeBest') || 0);
      document.getElementById('h').textContent = best;
      /* تهيئة لعبة جديدة */
      function reset() {
        snake = [
          { x: 8, y: 9 },
          { x: 7, y: 9 },
          { x: 6, y: 9 },
        ];
        dir = next = { x: 1, y: 0 };
        score = 0;
        placeFood();
        upd();
      }
      function placeFood() {
        do {
          food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
        } while (snake.some((p) => p.x === food.x && p.y === food.y));
      }
      function upd() {
        document.getElementById('s').textContent = score;
      }
      function buzz(ms) {
        window.FreeApp ? FreeApp.vibrate(ms) : navigator.vibrate && navigator.vibrate(ms);
      }
      /* خطوة حركة واحدة للثعبان */
      function step() {
        dir = next;
        const h = { x: (snake[0].x + dir.x + N) % N, y: (snake[0].y + dir.y + N) % N };
        if (snake.some((p) => p.x === h.x && p.y === h.y)) return over();
        snake.unshift(h);
        if (h.x === food.x && h.y === food.y) {
          score++;
          upd();
          buzz(15);
          placeFood();
          clearInterval(timer);
          timer = setInterval(step, Math.max(60, 140 - score * 3));
        } else snake.pop();
        draw();
      }
      /* رسم الطعام والثعبان */
      function draw() {
        x.clearRect(0, 0, c.width, c.height);
        x.fillStyle = '#F87171';
        x.beginPath();
        x.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.38, 0, 7);
        x.fill();
        snake.forEach((p, i) => {
          x.fillStyle = i ? '#86EFAC' : '#FDE047';
          x.beginPath();
          x.roundRect(p.x * cell + 1, p.y * cell + 1, cell - 2, cell - 2, 5);
          x.fill();
        });
      }
      /* نهاية اللعبة وحفظ أفضل نتيجة */
      function over() {
        running = false;
        clearInterval(timer);
        buzz(300);
        if (score > best) {
          best = score;
          localStorage.setItem('snakeBest', best);
          document.getElementById('h').textContent = best;
        }
        document.getElementById('msg').textContent = 'انتهت اللعبة — ' + score + ' · المس لإعادة المحاولة';
      }
      /* بدء اللعبة */
      function start() {
        if (running) return;
        reset();
        running = true;
        document.getElementById('msg').textContent = '';
        timer = setInterval(step, 140);
      }
      /* تغيير الاتجاه */
      function turn(dx, dy) {
        if (dx !== -dir.x || dy !== -dir.y) next = { x: dx, y: dy };
      }
      /* التحكم: اللمس والسحب ولوحة المفاتيح */
      let sx, sy;
      addEventListener(
        'touchstart',
        (e) => {
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          if (!running) start();
        },
        { passive: true },
      );
      addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - sx,
          dy = e.changedTouches[0].clientY - sy;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
      });
      addEventListener('keydown', (e) =>
        (
          ({
            ArrowUp: () => turn(0, -1),
            ArrowDown: () => turn(0, 1),
            ArrowLeft: () => turn(-1, 0),
            ArrowRight: () => turn(1, 0),
            ' ': start,
          })[e.key] || (() => {})
        )(),
      );
      addEventListener('click', () => {
        if (!running) start();
      });
      reset();
      draw();
    </script>
  </body>
</html>
