<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1E1B4B" />
    <title>فلابي بيرد</title>
    <!-- التنسيق العام للصفحة -->
    <style>
      /* ===== الهوية الموحدة: ليل نيلي + بنفسجي + ذهبي ===== */
      :root {
        --bg: #1e1b4b;
        --bg2: #2a2670;
        --brand: #7c3aed;
        --brand-d: #4338ca;
        --accent: #fbbf24;
        --card: #f5f3ff;
        --ink: #1e1b4b;
        --ink-soft: #4c1d95;
        --line: #ddd6fe;
        --font: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: var(--font);
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #pause {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(30, 27, 75, 0.6);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        display: none;
      }
      #pause:active {
        transform: scale(0.94);
      }
    </style>
  </head>
  <body>
    <!-- لوحة اللعبة -->
    <canvas id="c"></canvas>
    <!-- زر الإيقاف المؤقت -->
    <button id="pause" aria-label="إيقاف مؤقت">❚❚</button>
    <!-- منطق اللعبة -->
    <script>
      /* عناصر الصفحة */
      const cv = document.getElementById('c'),
        ctx = cv.getContext('2d'),
        pauseBtn = document.getElementById('pause');
      /* الثوابت الفيزيائية للعبة */
      const VH = 640,
        GROUND = 96; // الارتفاع الافتراضي وارتفاع الأرض (بوحدات العالم)
      const GRAV = 1500,
        FLAP = -430,
        SPEED = 165,
        PIPE_W = 68,
        GAP = 158,
        SPACING = 225,
        BIRD_R = 15;
      /* متغيرات الحالة */
      let W = 360,
        k = 1,
        dpr = 1; // العرض الافتراضي، وعدد بكسلات CSS لكل وحدة
      let state = 'ready',
        paused = false,
        score = 0,
        best = 0,
        overAt = 0,
        newBest = false;
      let bird,
        pipes,
        groundX = 0,
        cloudX = 0,
        hillX = 0,
        t0 = 0,
        flapAnim = 0;
      try {
        best = +localStorage.getItem('flappy.best') || 0;
      } catch (e) {}

      /* ضبط حجم اللوحة حسب الشاشة */
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 3);
        const cw = window.innerWidth,
          ch = window.innerHeight;
        cv.width = Math.round(cw * dpr);
        cv.height = Math.round(ch * dpr);
        k = ch / VH;
        W = cw / k;
        if (state === 'ready' && bird) bird.x = Math.min(W * 0.3, 140);
      }
      window.addEventListener('resize', resize);

      /* تهيئة لعبة جديدة */
      function reset() {
        bird = { x: Math.min(W * 0.3, 140), y: VH * 0.42, vy: 0, rot: 0 };
        pipes = [];
        score = 0;
        newBest = false;
      }
      function spawnPipe(x) {
        const minTop = 70,
          maxTop = VH - GROUND - GAP - 70;
        pipes.push({ x, top: minTop + Math.random() * (maxTop - minTop), passed: false });
      }
      function buzz(p) {
        try {
          if (window.FreeApp && FreeApp.vibrate) FreeApp.vibrate(p);
          else if (navigator.vibrate) navigator.vibrate(p);
        } catch (e) {}
      }

      /* القفز والتحكم */
      function flap() {
        if (paused) {
          paused = false;
          last = performance.now();
          return;
        }
        if (state === 'ready') {
          state = 'play';
          pauseBtn.style.display = 'block';
          pipes = [];
          spawnPipe(W + 60);
        }
        if (state === 'play') {
          bird.vy = FLAP;
          flapAnim = 1;
        } else if (state === 'over' && performance.now() - overAt > 700) {
          reset();
          state = 'ready';
        }
      }
      cv.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        flap();
      });
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
          e.preventDefault();
          if (!e.repeat) flap();
        }
        if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
      });
      function togglePause() {
        if (state !== 'play') return;
        paused = !paused;
        last = performance.now();
      }
      pauseBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        togglePause();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'play') paused = true;
        last = performance.now();
      });

      /* نهاية اللعبة وحفظ أفضل نتيجة */
      function die() {
        if (state !== 'play') return;
        state = 'over';
        overAt = performance.now();
        pauseBtn.style.display = 'none';
        buzz([0, 60, 40, 120]);
        if (score > best) {
          best = score;
          newBest = true;
          try {
            localStorage.setItem('flappy.best', best);
          } catch (e) {}
        }
      }

      /* تحديث الفيزياء والأنابيب والتصادم */
      function update(dt) {
        const scroll = state === 'over' ? 0 : SPEED * dt;
        groundX = (groundX - scroll) % 24;
        hillX = (hillX - scroll * 0.4) % 240;
        cloudX = (cloudX - scroll * 0.15) % 300;
        flapAnim = Math.max(0, flapAnim - dt * 4);
        if (state === 'ready') {
          bird.y = VH * 0.42 + Math.sin(performance.now() / 300) * 8;
          bird.rot = 0;
          return;
        }
        // فيزياء الطائر (تعمل أيضًا بعد الخسارة ليسقط إلى الأرض)
        bird.vy = Math.min(bird.vy + GRAV * dt, 900);
        bird.y += bird.vy * dt;
        const targetRot = Math.max(-0.45, Math.min(1.4, bird.vy / 600));
        bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 10);
        const floor = VH - GROUND - BIRD_R;
        if (bird.y > floor) {
          bird.y = floor;
          bird.vy = 0;
          die();
        }
        if (bird.y < -40) {
          bird.y = -40;
          bird.vy = 0;
        }
        if (state !== 'play') return;
        pipes.forEach((p) => {
          p.x -= scroll;
          if (!p.passed && p.x + PIPE_W < bird.x) {
            p.passed = true;
            score++;
            buzz(8);
          }
          // تصادم الدائرة (الطائر) مع مستطيلين (الأنبوبان)
          const r = BIRD_R - 2;
          [
            [p.x, -1000, PIPE_W, p.top + 1000],
            [p.x, p.top + GAP, PIPE_W, VH],
          ].forEach(([rx, ry, rw, rh]) => {
            const cx = Math.max(rx, Math.min(bird.x, rx + rw)),
              cy = Math.max(ry, Math.min(bird.y, ry + rh));
            if ((bird.x - cx) ** 2 + (bird.y - cy) ** 2 < r * r) die();
          });
        });
        if (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();
        const lastP = pipes[pipes.length - 1];
        if (!lastP || lastP.x < W - SPACING) spawnPipe((lastP ? lastP.x : W) + SPACING);
      }

      // ---------- الرسم ----------
      /* الرسم: السحب والخلفية والأنابيب والأرض والطائر */
      function cloud(x, y, s) {
        ctx.beginPath();
        ctx.arc(x, y, 18 * s, 0, 7);
        ctx.arc(x + 20 * s, y - 10 * s, 22 * s, 0, 7);
        ctx.arc(x + 44 * s, y, 18 * s, 0, 7);
        ctx.rect(x, y, 44 * s, 18 * s);
        ctx.fill();
      }
      function drawBg() {
        const g = ctx.createLinearGradient(0, 0, 0, VH);
        g.addColorStop(0, '#4EC0CA');
        g.addColorStop(0.75, '#A7E3E8');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, VH);
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        for (let x = cloudX - 300; x < W + 300; x += 300) {
          cloud(x + 30, 120, 1);
          cloud(x + 180, 200, 0.7);
        }
        // أفق المدينة والتلال (الطبقة الوسطى)
        const base = VH - GROUND;
        ctx.fillStyle = '#86D99A';
        for (let x = hillX - 240; x < W + 240; x += 240) {
          ctx.beginPath();
          ctx.ellipse(x + 60, base, 110, 60, 0, Math.PI, 0);
          ctx.ellipse(x + 190, base, 80, 42, 0, Math.PI, 0);
          ctx.fill();
        }
        ctx.fillStyle = '#B9E5C9';
        for (let x = hillX - 240; x < W + 240; x += 240) {
          [
            [0, 40, 14],
            [18, 62, 12],
            [34, 30, 16],
            [54, 74, 14],
            [72, 46, 12],
            [88, 58, 18],
            [110, 36, 14],
            [128, 66, 12],
            [144, 44, 16],
            [164, 52, 14],
            [182, 34, 12],
            [198, 60, 16],
            [218, 40, 14],
          ].forEach(([dx, h, w]) => ctx.fillRect(x + dx, base - 30 - h, w, h + 30));
        }
        ctx.fillStyle = '#73C987';
        for (let x = ((hillX * 1.6) % 120) - 120; x < W + 120; x += 60) {
          ctx.beginPath();
          ctx.arc(x, base, 26, Math.PI, 0);
          ctx.fill();
        }
      }
      function drawPipe(x, y, h, top) {
        const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
        g.addColorStop(0, '#5AA329');
        g.addColorStop(0.35, '#9BE15D');
        g.addColorStop(1, '#4A8C1F');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, PIPE_W, h);
        ctx.strokeStyle = '#2F5E12';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y, PIPE_W - 2, h);
        const capY = top ? y + h - 28 : y;
        ctx.fillStyle = g;
        ctx.fillRect(x - 5, capY, PIPE_W + 10, 28);
        ctx.strokeRect(x - 4, capY + 1, PIPE_W + 8, 26);
      }
      function drawGround() {
        const y = VH - GROUND;
        ctx.fillStyle = '#DED895';
        ctx.fillRect(0, y, W, GROUND);
        ctx.fillStyle = '#73BF2E';
        ctx.fillRect(0, y, W, 16);
        ctx.fillStyle = '#5DA024';
        for (let x = groundX - 24; x < W + 24; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, y + 16);
          ctx.lineTo(x + 12, y + 16);
          ctx.lineTo(x + 20, y);
          ctx.lineTo(x + 8, y);
          ctx.fill();
        }
        ctx.fillStyle = '#543847';
        ctx.fillRect(0, y - 2, W, 3);
        ctx.fillStyle = '#CBC27A';
        ctx.fillRect(0, y + 16, W, 4);
      }
      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rot);
        ctx.fillStyle = '#F8D33A';
        ctx.strokeStyle = '#543847';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 19, 15, 0, 0, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#FBE9A0';
        ctx.beginPath();
        ctx.ellipse(-2, 5, 12, 7, 0, 0, 7);
        ctx.fill();
        const wy =
          state === 'play'
            ? Math.sin(performance.now() / 50) * 4 * (0.4 + flapAnim)
            : Math.sin(performance.now() / 120) * 3;
        ctx.fillStyle = '#FFF4C2';
        ctx.beginPath();
        ctx.ellipse(-9, wy, 9, 6, -0.3, 0, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(8, -6, 6.5, 0, 7);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(10, -6, 2.6, 0, 7);
        ctx.fill();
        ctx.fillStyle = '#F2672E';
        ctx.beginPath();
        ctx.moveTo(12, 1);
        ctx.lineTo(26, 3);
        ctx.lineTo(12, 9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      /* الرسم: النصوص */
      function text(s, x, y, size, fill = '#fff', align = 'center') {
        ctx.font = '800 ' + size + 'px system-ui,sans-serif';
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = size / 6;
        ctx.strokeStyle = '#543847';
        ctx.strokeText(s, x, y);
        ctx.fillStyle = fill;
        ctx.fillText(s, x, y);
      }
      function rrect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      /* الميدالية حسب النتيجة */
      function medal() {
        if (score >= 40) return ['بلاتينية', '#E5E4E2'];
        if (score >= 30) return ['ذهبية', '#F5C542'];
        if (score >= 20) return ['فضية', '#C0C7CF'];
        if (score >= 10) return ['برونزية', '#CD7F32'];
        return null;
      }
      /* واجهة اللعبة (البداية والنهاية والإيقاف) */
      function drawUI() {
        const cx = W / 2;
        if (state === 'play') text(String(score), cx, 80, 52);
        if (state === 'ready') {
          text('فلابي بيرد', cx, 150, 44, '#FDE047');
          text('المس أو اضغط مسافة للقفز', cx, VH * 0.58, 18);
          text('الأفضل: ' + best, cx, VH * 0.58 + 34, 18);
          // تلميح اللمس
          const a = (Math.sin(performance.now() / 250) + 1) / 2;
          ctx.globalAlpha = 0.5 + a * 0.5;
          text('👆', cx, VH * 0.58 + 84, 34);
          ctx.globalAlpha = 1;
        }
        if (state === 'over') {
          text('انتهت اللعبة', cx, 150, 44, '#F97316');
          const bw = Math.min(280, W - 40),
            bx = cx - bw / 2,
            by = 200;
          ctx.fillStyle = '#DED895';
          ctx.strokeStyle = '#543847';
          ctx.lineWidth = 3;
          rrect(bx, by, bw, 150, 14);
          ctx.fill();
          ctx.stroke();
          const m = medal();
          ctx.fillStyle = '#D7A64A';
          ctx.font = '800 14px system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('الميدالية', bx + 62, by + 28);
          ctx.beginPath();
          ctx.arc(bx + 62, by + 82, 34, 0, 7);
          ctx.fillStyle = m ? m[1] : '#CBC27A';
          ctx.fill();
          ctx.stroke();
          if (m) {
            ctx.fillStyle = 'rgba(255,255,255,.6)';
            ctx.beginPath();
            ctx.arc(bx + 52, by + 70, 9, 0, 7);
            ctx.fill();
            ctx.fillStyle = '#543847';
            ctx.font = '800 12px system-ui';
            ctx.fillText(m[0], bx + 62, by + 132);
          } else {
            ctx.fillStyle = '#9C9455';
            ctx.font = '700 11px system-ui';
            ctx.fillText('10 للبرونزية', bx + 62, by + 132);
          }
          ctx.fillStyle = '#D7A64A';
          ctx.font = '800 14px system-ui';
          ctx.textAlign = 'right';
          ctx.fillText('النتيجة', bx + bw - 20, by + 28);
          ctx.fillText('الأفضل', bx + bw - 20, by + 86);
          text(String(score), bx + bw - 20, by + 56, 30, '#fff', 'right');
          text(String(best), bx + bw - 20, by + 114, 30, '#fff', 'right');
          if (newBest) {
            ctx.fillStyle = '#EF4444';
            rrect(bx + bw - 120, by + 76, 44, 20, 6);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = '800 11px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('جديد', bx + bw - 98, by + 86);
          }
          if (performance.now() - overAt > 700) text('المس للعب مرة أخرى', cx, by + 190, 20);
        }
        if (paused) {
          ctx.fillStyle = 'rgba(0,0,0,.35)';
          ctx.fillRect(0, 0, W, VH);
          text('متوقف مؤقتًا', cx, VH * 0.4, 44);
          text('المس للمتابعة', cx, VH * 0.4 + 50, 20);
        }
      }
      /* رسم الإطار كاملًا */
      function draw() {
        ctx.direction = 'rtl'; // اتجاه النص العربي داخل اللوحة
        ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
        drawBg();
        pipes.forEach((p) => {
          drawPipe(p.x, -10, p.top + 10, true);
          drawPipe(p.x, p.top + GAP, VH - GROUND - p.top - GAP, false);
        });
        drawGround();
        drawBird();
        drawUI();
      }
      /* حلقة اللعبة */
      let last = performance.now();
      function loop(now) {
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 1 / 30) dt = 1 / 30; // تحديد سقف للزمن بعد التقطّع حتى تبقى الفيزياء مستقرة
        if (!paused && dt > 0) update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      resize();
      reset();
      requestAnimationFrame((t) => {
        last = t;
        loop(t);
      });
    </script>
  </body>
</html>
