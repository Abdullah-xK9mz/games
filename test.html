<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1B4B" />
    <title>اختبار المعلومات</title>
    <!-- التنسيق العام للصفحة -->
    <style>
      /* ===== الهوية الموحدة: ليل نيلي + بنفسجي + ذهبي ===== */
      :root {
        --bg: #1e1b4b;
        --bg2: #2a2670;
        --brand: #7c3aed;
        --brand-d: #4338ca;
        --accent: #fbbf24;
        --card: #f5f3ff;
        --ink: #1e1b4b;
        --ink-soft: #4c1d95;
        --line: #ddd6fe;
        --font: system-ui, -apple-system, 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: #eef2ff;
        min-height: 100vh;
        user-select: none;
        -webkit-user-select: none;
      }
      header {
        background: linear-gradient(135deg, var(--brand-d), var(--brand));
        color: #fff;
        padding: calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 18px
          calc(18px + env(safe-area-inset-left));
      }
      header h1 {
        margin: 0;
        font-size: 23px;
      }
      header p {
        margin: 4px 0 0;
        font-size: 13px;
        opacity: 0.85;
      }
      .screen {
        display: none;
        padding: 16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(16px + env(safe-area-inset-left));
        max-width: 560px;
        margin: 0 auto;
      }
      .screen.on {
        display: block;
        animation: in 0.25s ease;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      /* بطاقات الفئات */
      .cats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .cat {
        border: 0;
        border-radius: 20px;
        padding: 18px 14px;
        text-align: left;
        color: #fff;
        min-height: 132px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 12px rgba(67, 56, 202, 0.18);
      }
      .cat:active {
        transform: scale(0.97);
      }
      .cat .e {
        font-size: 34px;
      }
      .cat b {
        font-size: 17px;
        margin-top: auto;
      }
      .cat small {
        opacity: 0.9;
        font-size: 12px;
        margin-top: 2px;
      }
      .note {
        font-size: 13px;
        color: #a5b4fc;
        text-align: center;
        margin-top: 18px;
      }
      .qtop {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .qtop .prog {
        flex: 1;
        font-size: 13px;
        font-weight: 700;
        color: #c7d2fe;
      }
      .qtop .sc {
        font-size: 13px;
        font-weight: 700;
        background: var(--card);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 999px;
      }
      /* مؤقت السؤال الدائري */
      .timer {
        position: relative;
        width: 52px;
        height: 52px;
        flex: none;
      }
      .timer svg {
        transform: rotate(-90deg);
      }
      .timer circle {
        fill: none;
        stroke-width: 5;
      }
      .timer .bg {
        stroke: rgba(255, 255, 255, 0.16);
      }
      .timer .fg {
        stroke: var(--accent);
        stroke-linecap: round;
      }
      .timer b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 16px;
      }
      .timer.low .fg {
        stroke: #ef4444;
      }
      .timer.low b {
        color: #f87171;
      }
      .bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .bar div {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s;
      }
      .q {
        background: var(--card);
        color: var(--ink);
        border-radius: 20px;
        padding: 20px;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.35;
        box-shadow: 0 1px 3px rgba(30, 27, 75, 0.08);
        margin-bottom: 14px;
        min-height: 100px;
      }
      /* الإجابات */
      .ans {
        display: grid;
        gap: 10px;
      }
      .ans button {
        border: 2px solid var(--line);
        background: #fff;
        border-radius: 16px;
        padding: 15px 16px;
        font-size: 16px;
        text-align: left;
        color: #1e1b4b;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .ans button:active {
        transform: scale(0.98);
      }
      .ans button .k {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #ede9fe;
        display: grid;
        place-items: center;
        font-size: 13px;
        flex: none;
        color: var(--brand-d);
      }
      .ans button.right {
        background: #dcfce7;
        border-color: #22c55e;
      }
      .ans button.right .k {
        background: #22c55e;
        color: #fff;
      }
      .ans button.wrong {
        background: #fee2e2;
        border-color: #ef4444;
      }
      .ans button.wrong .k {
        background: #ef4444;
        color: #fff;
      }
      .ans button:disabled {
        opacity: 1;
      }
      .feedback {
        text-align: center;
        font-weight: 700;
        min-height: 24px;
        margin: 14px 0 6px;
      }
      .primary {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 15px;
        font-size: 16px;
        font-weight: 700;
        background: var(--accent);
        color: var(--ink);
        margin-top: 8px;
      }
      .primary.alt {
        background: var(--card);
        color: var(--ink-soft);
        box-shadow: 0 1px 3px rgba(30, 27, 75, 0.1);
      }
      .primary:active {
        transform: scale(0.98);
      }
      /* شاشة النتيجة والمراجعة */
      .result {
        background: var(--card);
        color: var(--ink);
        border-radius: 24px;
        padding: 26px 20px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(30, 27, 75, 0.08);
      }
      .result .big {
        font-size: 60px;
      }
      .result h2 {
        margin: 6px 0;
        font-size: 24px;
      }
      .result .score {
        font-size: 44px;
        font-weight: 800;
        color: var(--brand-d);
      }
      .result p {
        margin: 6px 0;
        color: #4b5563;
      }
      .rv {
        background: var(--card);
        color: var(--ink);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 10px;
        border-left: 5px solid #22c55e;
      }
      .rv.bad {
        border-left-color: #ef4444;
      }
      .rv .qq {
        font-weight: 700;
        margin-bottom: 6px;
      }
      .rv div {
        font-size: 14px;
        margin-top: 3px;
      }
      .rv .you {
        color: #dc2626;
      }
      .rv .ok {
        color: #16a34a;
      }

      /* عرض النص العربي بالاتجاه الصحيح دون تغيير التخطيط */
      h1,
      h2,
      p,
      b,
      small,
      span,
      button,
      div {
        unicode-bidi: plaintext;
      }
      .feedback:not(:empty) {
        background: var(--card);
        border-radius: 999px;
        padding: 6px 16px;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
      }
      /* ألوان بطاقات الفئات من هوية الألعاب (الكود يضع لوناً مضمّناً لذا نستبدله بالتنسيق) */
      .cats .cat:nth-child(1) {
        background: linear-gradient(135deg, #7c3aed, #4338ca) !important;
      }
      .cats .cat:nth-child(2) {
        background: linear-gradient(135deg, #38bdf8, #4f46e5) !important;
      }
      .cats .cat:nth-child(3) {
        background: linear-gradient(135deg, #2dd4bf, #6d28d9) !important;
      }
      .cats .cat:nth-child(4) {
        background: linear-gradient(135deg, #fbbf24, #d97706) !important;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- الرأس -->
    <header>
      <h1 id="hTitle">❓ اختبار المعلومات</h1>
      <p id="hSub">اختر فئة. 10 أسئلة، و15 ثانية لكل سؤال.</p>
    </header>

    <!-- الشاشة الرئيسية: اختيار الفئة -->
    <section class="screen on" id="home">
      <div class="cats" id="cats"></div>
      <p class="note">نصيحة: أجب بسرعة — الأسئلة التي لا تُجاب تُحسب خاطئة.</p>
    </section>

    <!-- شاشة الأسئلة -->
    <section class="screen" id="quiz">
      <div class="qtop">
        <div class="prog" id="prog">السؤال 1 / 10</div>
        <div class="sc" id="liveScore">النتيجة 0</div>
        <div class="timer" id="timer">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="bg" cx="26" cy="26" r="22" />
            <circle class="fg" id="timerFg" cx="26" cy="26" r="22" />
          </svg>
          <b id="timerTxt">15</b>
        </div>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="q" id="question"></div>
      <div class="ans" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="primary" id="nextBtn" style="visibility: hidden">التالي</button>
    </section>

    <!-- شاشة النتيجة -->
    <section class="screen" id="result">
      <div class="result">
        <div class="big" id="rEmoji">🏆</div>
        <h2 id="rTitle">عمل رائع!</h2>
        <div class="score" id="rScore">0/10</div>
        <p id="rBest"></p>
      </div>
      <button class="primary" id="reviewBtn">مراجعة الإجابات</button>
      <button class="primary alt" id="retryBtn">العب مرة أخرى</button>
      <button class="primary alt" id="homeBtn">اختر فئة أخرى</button>
    </section>

    <!-- شاشة مراجعة الإجابات -->
    <section class="screen" id="review">
      <div id="reviewList"></div>
      <button class="primary alt" id="backBtn">العودة إلى النتائج</button>
    </section>

    <!-- منطق الاختبار -->
    <script>
      (function () {
        /* بنك الأسئلة: لكل فئة اسم ورمز ولون وعشرة أسئلة [السؤال، الإجابة الصحيحة، ثلاث إجابات خاطئة] */
        var BANK = {
          general: {
            name: 'عام',
            emoji: '🌍',
            color: 'linear-gradient(135deg,#6366F1,#8B5CF6)',
            q: [
              ['كم عدد القارات على كوكب الأرض؟', '7', ['5', '6', '8']],
              ['أي كوكب يُعرف بالكوكب الأحمر؟', 'المريخ', ['الزهرة', 'المشتري', 'عطارد']],
              ['كم عدد أضلاع الشكل السداسي؟', '6', ['5', '7', '8']],
              ['من رسم لوحة الموناليزا؟', 'ليوناردو دا فينشي', ['مايكل أنجلو', 'رافائيل', 'فينسنت فان غوخ']],
              [
                'ما أكبر محيط على كوكب الأرض؟',
                'المحيط الهادئ',
                ['المحيط الأطلسي', 'المحيط الهندي', 'المحيط المتجمد الشمالي'],
              ],
              ['كم دقيقة في اليوم الواحد؟', '1,440', ['1,240', '1,340', '1,640']],
              ['ما أصلب مادة طبيعية معروفة؟', 'الألماس', ['الكوارتز', 'الغرانيت', 'الحديد']],
              [
                'أي لغة لها أكبر عدد من الناطقين بها كلغة أم؟',
                'الصينية الماندرين',
                ['الإنجليزية', 'الإسبانية', 'الهندية'],
              ],
              ['في أي عام غرقت سفينة تايتانيك؟', '1912', ['1905', '1915', '1920']],
              ['كم لاعبًا لكل فريق داخل الملعب في كرة القدم؟', '11', ['9', '10', '12']],
            ],
          },
          science: {
            name: 'العلوم',
            emoji: '🔬',
            color: 'linear-gradient(135deg,#0EA5E9,#2563EB)',
            q: [
              ['ما الرمز الكيميائي للذهب؟', 'Au', ['Ag', 'Gd', 'Go']],
              [
                'أي غاز تمتصه النباتات من الهواء في عملية البناء الضوئي؟',
                'ثاني أكسيد الكربون',
                ['الأكسجين', 'النيتروجين', 'الهيدروجين'],
              ],
              [
                'ما السرعة التقريبية للضوء في الفراغ؟',
                '300,000 كم في الثانية',
                ['30,000 كم في الثانية', '3,000 كم في الثانية', '3,000,000 كم في الثانية'],
              ],
              [
                'أي جزء في الخلية يُعرف بمحطة الطاقة فيها؟',
                'الميتوكوندريا',
                ['النواة', 'الريبوسوم', 'جهاز غولجي'],
              ],
              ['عند مستوى سطح البحر، عند أي درجة حرارة يغلي الماء؟', '100 °م', ['90 °م', '110 °م', '120 °م']],
              [
                'ما الغاز الأكثر وفرة في الغلاف الجوي للأرض؟',
                'النيتروجين',
                ['الأكسجين', 'ثاني أكسيد الكربون', 'الأرغون'],
              ],
              ['كم عدد العظام في جسم الإنسان البالغ؟', '206', ['186', '226', '256']],
              ['أي عنصر رقمه الذري 1؟', 'الهيدروجين', ['الهيليوم', 'الأكسجين', 'الكربون']],
              ['ما أكبر كوكب في مجموعتنا الشمسية؟', 'المشتري', ['زحل', 'نبتون', 'الأرض']],
              ['ما وحدة قياس المقاومة الكهربائية في النظام الدولي؟', 'الأوم', ['الفولت', 'الأمبير', 'الواط']],
            ],
          },
          geography: {
            name: 'الجغرافيا',
            emoji: '🗺️',
            color: 'linear-gradient(135deg,#10B981,#047857)',
            q: [
              ['ما عاصمة أستراليا؟', 'كانبرا', ['سيدني', 'ملبورن', 'بيرث']],
              ['ما أطول نهر في أفريقيا؟', 'النيل', ['الكونغو', 'النيجر', 'الزمبيزي']],
              ['ما أعلى جبل فوق مستوى سطح البحر؟', 'جبل إيفرست', ['كيه 2', 'كانشينجونغا', 'كليمنجارو']],
              ['ما أكبر دولة من حيث المساحة؟', 'روسيا', ['كندا', 'الصين', 'الولايات المتحدة']],
              ['ما عاصمة كندا؟', 'أوتاوا', ['تورنتو', 'فانكوفر', 'مونتريال']],
              [
                'ما أكبر صحراء حارة في العالم؟',
                'الصحراء الكبرى',
                ['صحراء غوبي', 'صحراء كالاهاري', 'الصحراء العربية'],
              ],
              ['في أي دولة تقع ماتشو بيتشو؟', 'بيرو', ['بوليفيا', 'تشيلي', 'المكسيك']],
              ['في أي دولة يقع جبل كليمنجارو؟', 'تنزانيا', ['كينيا', 'أوغندا', 'إثيوبيا']],
              ['ما أصغر دولة في العالم من حيث المساحة؟', 'الفاتيكان', ['موناكو', 'سان مارينو', 'ليختنشتاين']],
              ['أي مضيق يفصل إسبانيا عن المغرب؟', 'مضيق جبل طارق', ['البوسفور', 'مضيق هرمز', 'مضيق ملقا']],
            ],
          },
          tech: {
            name: 'التقنية',
            emoji: '💻',
            color: 'linear-gradient(135deg,#F59E0B,#EA580C)',
            q: [
              [
                'ما الاسم الكامل لـ CPU؟',
                'Central Processing Unit',
                ['Computer Personal Unit', 'Central Program Utility', 'Core Processing Utility'],
              ],
              [
                'ما الاسم الكامل لـ HTML؟',
                'HyperText Markup Language',
                ['High Tech Modern Language', 'HyperTransfer Markup Language', 'Home Tool Markup Language'],
              ],
              [
                'من شارك ستيف جوبز في تأسيس أبل عام 1976؟',
                'ستيف وزنياك',
                ['بيل غيتس', 'بول ألين', 'لاري بيج'],
              ],
              ['كم بتًّا في البايت الواحد؟', '8', ['4', '16', '32']],
              ['أي شركة تطوّر نظام التشغيل أندرويد؟', 'جوجل', ['أبل', 'مايكروسوفت', 'سامسونج']],
              [
                'ما الاسم الكامل لـ HTTP؟',
                'HyperText Transfer Protocol',
                [
                  'High Transfer Text Protocol',
                  'HyperText Transmission Program',
                  'Host Transfer Text Protocol',
                ],
              ],
              ['أي لغة برمجة تعمل أصلًا داخل متصفحات الويب؟', 'JavaScript', ['Python', 'C++', 'Java']],
              [
                'ما الاسم الكامل لـ RAM؟',
                'Random Access Memory',
                ['Read Access Memory', 'Rapid Action Memory', 'Run All Memory'],
              ],
              ['كم بايتًا في الكيبيبايت (KiB) الواحد؟', '1,024', ['1,000', '512', '2,048']],
              [
                'من يُنسب إليه اختراع شبكة الويب العالمية؟',
                'تيم بيرنرز لي',
                ['فينت سيرف', 'آلان تورينغ', 'لينوس تورفالدز'],
              ],
            ],
          },
        };
        /* الإعدادات والأدوات المساعدة */
        var LIMIT = 15000,
          KEYS = ['A', 'B', 'C', 'D'],
          LABELS = ['أ', 'ب', 'ج', 'د'];
        var $ = function (id) {
          return document.getElementById(id);
        };
        function load(k, d) {
          try {
            var v = localStorage.getItem(k);
            return v === null ? d : JSON.parse(v);
          } catch (e) {
            return d;
          }
        }
        function save(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        }
        function shuffle(a) {
          a = a.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }
        function buzz(p) {
          if (window.FreeApp && FreeApp.vibrate) FreeApp.vibrate(p);
          else if (navigator.vibrate) navigator.vibrate(p);
        }

        /* الحالة */
        var bests = load('quiz.bests', {});
        var cat = null,
          questions = [],
          idx = 0,
          score = 0,
          log = [],
          answered = false,
          qStart = 0,
          raf = null,
          remaining = LIMIT,
          inQuiz = false;
        var C = 2 * Math.PI * 22;
        $('timerFg').style.strokeDasharray = C;

        /* عرض الشاشات */
        function show(id) {
          document.querySelectorAll('.screen').forEach(function (s) {
            s.classList.toggle('on', s.id === id);
          });
          window.scrollTo(0, 0);
          if (id === 'home') {
            $('hTitle').textContent = '❓ اختبار المعلومات';
            $('hSub').textContent = 'اختر فئة. 10 أسئلة، و15 ثانية لكل سؤال.';
          } else if (cat) {
            $('hTitle').textContent = BANK[cat].emoji + ' ' + BANK[cat].name;
            $('hSub').textContent =
              id === 'review' ? 'إجاباتك' : 'الأفضل: ' + (bests[cat] != null ? bests[cat] + '/10' : '—');
          }
        }

        /* رسم بطاقات الفئات */
        function renderHome() {
          var box = $('cats');
          box.innerHTML = '';
          Object.keys(BANK).forEach(function (k) {
            var c = BANK[k],
              b = document.createElement('button');
            b.className = 'cat';
            b.style.background = c.color;
            var e = document.createElement('span');
            e.className = 'e';
            e.textContent = c.emoji;
            var n = document.createElement('b');
            n.textContent = c.name;
            var s = document.createElement('small');
            s.textContent = bests[k] != null ? 'الأفضل ' + bests[k] + '/' + c.q.length : 'لم تُلعب بعد';
            b.appendChild(e);
            b.appendChild(n);
            b.appendChild(s);
            b.onclick = function () {
              start(k, true);
            };
            box.appendChild(b);
          });
        }

        /* بدء اختبار جديد */
        function start(k, push) {
          cat = k;
          idx = 0;
          score = 0;
          log = [];
          inQuiz = true;
          questions = shuffle(BANK[k].q).map(function (q) {
            return { text: q[0], correct: q[1], options: shuffle([q[1]].concat(q[2])) };
          });
          if (push) history.pushState({ v: 'quiz' }, '');
          else history.replaceState({ v: 'quiz' }, '');
          show('quiz');
          renderQuestion();
        }

        /* عرض السؤال وخياراته */
        function renderQuestion() {
          var q = questions[idx];
          answered = false;
          $('prog').textContent = 'السؤال ' + (idx + 1) + ' / ' + questions.length;
          $('liveScore').textContent = 'النتيجة ' + score;
          $('barFill').style.width = (idx / questions.length) * 100 + '%';
          $('question').textContent = q.text;
          $('feedback').textContent = '';
          $('nextBtn').style.visibility = 'hidden';
          var box = $('answers');
          box.innerHTML = '';
          q.options.forEach(function (o, i) {
            var b = document.createElement('button');
            var k = document.createElement('span');
            k.className = 'k';
            k.textContent = LABELS[i];
            var t = document.createElement('span');
            t.textContent = o;
            b.appendChild(k);
            b.appendChild(t);
            b.dataset.v = o;
            b.onclick = function () {
              answer(o);
            };
            box.appendChild(b);
          });
          qStart = Date.now();
          remaining = LIMIT;
          startClock();
        }

        /* مؤقت السؤال (15 ثانية) */
        function startClock() {
          stopClock();
          raf = requestAnimationFrame(tick);
        }
        function stopClock() {
          if (raf) cancelAnimationFrame(raf);
          raf = null;
        }
        function tick() {
          var left = Math.max(0, remaining - (Date.now() - qStart));
          $('timerTxt').textContent = Math.ceil(left / 1000);
          $('timerFg').style.strokeDashoffset = C * (1 - left / LIMIT);
          $('timer').classList.toggle('low', left <= 5000);
          if (left <= 0) {
            raf = null;
            answer(null);
            return;
          }
          raf = requestAnimationFrame(tick);
        }

        /* معالجة الإجابة وعرض الصواب والخطأ */
        function answer(choice) {
          if (answered) return;
          answered = true;
          stopClock();
          var q = questions[idx],
            ok = choice === q.correct;
          if (ok) score++;
          log.push({ q: q.text, correct: q.correct, chosen: choice });
          document.querySelectorAll('#answers button').forEach(function (b) {
            b.disabled = true;
            if (b.dataset.v === q.correct) b.classList.add('right');
            else if (b.dataset.v === choice) b.classList.add('wrong');
          });
          var fb = $('feedback');
          if (ok) {
            fb.textContent = '✅ إجابة صحيحة!';
            fb.style.color = '#16A34A';
            buzz(20);
          } else {
            fb.textContent = choice === null ? '⏰ انتهى الوقت!' : '❌ إجابة خاطئة';
            fb.style.color = '#DC2626';
            buzz([0, 40, 40, 40]);
          }
          $('liveScore').textContent = 'النتيجة ' + score;
          $('nextBtn').textContent = idx + 1 < questions.length ? 'السؤال التالي ←' : 'عرض النتيجة';
          $('nextBtn').style.visibility = 'visible';
        }

        /* الانتقال إلى السؤال التالي */
        function next() {
          if (!answered) return;
          if (idx + 1 < questions.length) {
            idx++;
            renderQuestion();
          } else finish();
        }

        /* حساب النتيجة النهائية */
        function finish() {
          inQuiz = false;
          var total = questions.length,
            prev = bests[cat],
            rec = prev == null || score > prev;
          if (rec) {
            bests[cat] = score;
            save('quiz.bests', bests);
          }
          var pct = score / total;
          $('rEmoji').textContent = pct === 1 ? '🏆' : pct >= 0.7 ? '🎉' : pct >= 0.4 ? '👍' : '📚';
          $('rTitle').textContent =
            pct === 1 ? 'نتيجة كاملة!' : pct >= 0.7 ? 'عمل رائع!' : pct >= 0.4 ? 'ليس سيئًا!' : 'واصل التدرّب!';
          $('rScore').textContent = score + '/' + total;
          $('rBest').textContent =
            rec && prev != null
              ? '🏅 رقم قياسي جديد في ' + BANK[cat].name + '!'
              : 'الأفضل في ' + BANK[cat].name + ': ' + bests[cat] + '/' + total;
          history.replaceState({ v: 'result' }, '');
          show('result');
          renderHome();
        }

        /* مراجعة الإجابات */
        function renderReview() {
          var box = $('reviewList');
          box.innerHTML = '';
          log.forEach(function (r, i) {
            var ok = r.chosen === r.correct,
              d = document.createElement('div');
            d.className = 'rv' + (ok ? '' : ' bad');
            var q = document.createElement('div');
            q.className = 'qq';
            q.textContent = i + 1 + '. ' + r.q;
            d.appendChild(q);
            if (!ok) {
              var y = document.createElement('div');
              y.className = 'you';
              y.textContent = 'إجابتك: ' + (r.chosen === null ? 'لا توجد إجابة (انتهى الوقت)' : r.chosen);
              d.appendChild(y);
            }
            var c = document.createElement('div');
            c.className = 'ok';
            c.textContent = (ok ? '✓ ' : 'الإجابة الصحيحة: ') + r.correct;
            d.appendChild(c);
            box.appendChild(d);
          });
        }

        /* ربط الأزرار بالأحداث */
        $('nextBtn').onclick = next;
        $('reviewBtn').onclick = function () {
          renderReview();
          history.pushState({ v: 'review' }, '');
          show('review');
        };
        $('backBtn').onclick = function () {
          history.back();
        };
        $('retryBtn').onclick = function () {
          start(cat, false);
        };
        $('homeBtn').onclick = function () {
          history.back();
        };
        document.addEventListener('keydown', function (e) {
          if (!$('quiz').classList.contains('on')) return;
          var i = KEYS.indexOf(e.key.toUpperCase());
          if (i < 0) i = LABELS.indexOf(e.key);
          if (i >= 0 && !answered) {
            var b = document.querySelectorAll('#answers button')[i];
            if (b) b.click();
          } else if ((e.key === 'Enter' || e.key === ' ') && answered) next();
        });

        /* التنقل بزر الرجوع */
        window.addEventListener('popstate', function (e) {
          var v = e.state && e.state.v;
          if (v === 'result' && cat) {
            stopClock();
            show('result');
          } else if (v === 'quiz' && inQuiz) show('quiz');
          else if (v === 'review' && log.length) {
            renderReview();
            show('review');
          } else {
            stopClock();
            inQuiz = false;
            renderHome();
            show('home');
          }
        });

        // إيقاف مؤقت السؤال عندما يكون التطبيق في الخلفية
        document.addEventListener('visibilitychange', function () {
          if (!inQuiz || answered) return;
          if (document.hidden) {
            remaining = Math.max(0, remaining - (Date.now() - qStart));
            stopClock();
          } else {
            qStart = Date.now();
            startClock();
          }
        });

        if (history.state && history.state.v) history.replaceState(null, '');
        renderHome();
      })();
    </script>
  </body>
</html>
